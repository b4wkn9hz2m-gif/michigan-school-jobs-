name: Probe source pages
# Fetches sample pages from job sources and commits them to the probe-data branch,
# so the collector can be developed against real page formats. Approved by the repo owner.
on:
  push:
    branches: [probe-data]
    paths: [".github/workflows/probe.yml", "probe/urls.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pages
        run: |
          mkdir -p probe/pages
          : > probe/status.txt
          while read -r name url; do
            [ -z "$name" ] && continue
            code=$(curl -sS -L -m 30 -A "MichiganSchoolJobsBot/1.0 (+job listings aggregator)" -o "probe/pages/$name" -w "%{http_code} %{size_download} %{content_type}" "$url" || echo "ERR")
            echo "$name $code $url" >> probe/status.txt
            sleep 1
          done < probe/urls.txt
          cat probe/status.txt
      - name: Commit results
        run: |
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          git add probe; git diff --cached --quiet || git commit -m "Probe results $(date -u +%FT%TZ)"
          git push
