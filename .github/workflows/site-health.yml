name: Site health check
# Loads the live site like a visitor would. Runs daily and on demand; a failure means the site
# (or a key page) is down, and GitHub emails the repo owner.
on:
  schedule:
    - cron: "47 11 * * *" # ~7:47am Eastern, after the morning update
  workflow_dispatch:
    inputs:
      wait_seconds:
        description: "Wait before checking (e.g. right after a deploy)"
        required: false
        default: "0"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deploy
        if: ${{ github.event.inputs.wait_seconds != '' && github.event.inputs.wait_seconds != '0' }}
        run: sleep ${{ github.event.inputs.wait_seconds }}
      - name: Check pages
        run: |
          fail=0
          check() { # url expected-text
            out=$(curl -sS -L -m 30 -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Safari/605.1.15" -D headers.txt -o page.html -w "%{http_code} %{url_effective}" "$1" 2>&1) || true
            code=${out%% *}
            if [ "$code" = "200" ] && grep -qi "$2" page.html; then echo "OK    $code  $1"; else echo "FAIL  $out  $1 (looking for: $2)"; grep -iE "^(server|cf-mitigated|cf-ray|content-type):" headers.txt | tr -d '\r' | sed 's/^/        /'; head -c 300 page.html | tr '\n' ' ' | sed 's/^/        body: /'; echo; fail=1; fi
          }
          echo "--- old workers.dev address (should be off, i.e. not 200):"
          curl -sS -o /dev/null -m 30 -w "%{http_code}\n" https://michigan-school-jobs.shloimysicker.workers.dev/ || true
          echo "--- bare domain (should redirect to www once the redirect rule is added):"
          curl -sS -o /dev/null -m 30 -w "%{http_code} -> %{redirect_url}\n" https://michigan-school-jobs.com/ || true
          echo "--- payment automation (hooks.michigan-school-jobs.com):"
          curl -sS -m 30 -o hook.txt -w "GET  %{http_code}\n" https://hooks.michigan-school-jobs.com/ 2>&1 || true; head -c 80 hook.txt 2>/dev/null; echo
          grep -q "2026-11-05.2" hook.txt && echo "     running latest automation code" || echo "     NOTE: automation is running OLD code (not yet redeployed from GitHub)"
          echo "--- Stripe checkout links:"
          for u in $(curl -sS -m 30 https://www.michigan-school-jobs.com/pricing/ | grep -o 'https://buy.stripe.com/[A-Za-z0-9]*' | sort -u); do curl -sS -o /dev/null -m 30 -w "%{http_code}  $u\n" "$u" || true; done
          curl -sS -m 30 -o hook.txt -w "POST %{http_code} (400 'bad signature' = worker is live and checking Stripe signatures)\n" -X POST -d '{}' https://hooks.michigan-school-jobs.com/stripe-webhook 2>&1 || true; head -c 80 hook.txt 2>/dev/null; echo
          echo "--- main domain:"
          for host in https://www.michigan-school-jobs.com; do
            check "$host/" "Michigan School"
            check "$host/jobs/" "Positions"
            check "$host/sitemap.xml" "<urlset"
            check "$host/counties/wayne/" "Wayne County"
          done
          # A real job page and its Apply link
          job=$(grep -o 'https://michigan-school-jobs.com/jobs/[^<]*' page.html | head -1 || true)
          curl -sS -m 30 https://www.michigan-school-jobs.com/sitemap.xml 2>/dev/null | grep -o 'https://www.michigan-school-jobs.com/jobs/[^<]*' | head -1 > joburl.txt || true
          if [ -s joburl.txt ]; then check "$(cat joburl.txt)" "Apply for Job"; fi
          exit $fail
