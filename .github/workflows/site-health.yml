name: Site health check
# Loads the live site like a visitor would. Runs daily and on demand; a failure means the site
# (or a key page) is down, and GitHub emails the repo owner.
on:
  schedule:
    - cron: "47 11 * * *" # ~7:47am Eastern, after the morning update
  workflow_dispatch:
    inputs:
      wait_seconds:
        description: "Wait before checking (e.g. right after a deploy)"
        required: false
        default: "0"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deploy
        if: ${{ github.event.inputs.wait_seconds != '' && github.event.inputs.wait_seconds != '0' }}
        run: sleep ${{ github.event.inputs.wait_seconds }}
      - name: Check pages
        run: |
          fail=0
          check() { # url expected-text
            out=$(curl -sS -L -m 30 -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Safari/605.1.15" -D headers.txt -o page.html -w "%{http_code} %{url_effective}" "$1" 2>&1) || true
            code=${out%% *}
            if [ "$code" = "200" ] && grep -qi "$2" page.html; then echo "OK    $code  $1"; else echo "FAIL  $out  $1 (looking for: $2)"; grep -iE "^(server|cf-mitigated|cf-ray|content-type):" headers.txt | tr -d '\r' | sed 's/^/        /'; head -c 300 page.html | tr '\n' ' ' | sed 's/^/        body: /'; echo; fail=1; fi
          }
          echo "--- backup address:"
          check "https://michigan-school-jobs.shloimysicker.workers.dev/" "Michigan School" || true
          check "https://michigan-school-jobs.shloimysicker.workers.dev/jobs/" "Positions" || true
          echo "--- main domain:"
          for host in https://michigan-school-jobs.com https://www.michigan-school-jobs.com; do
            check "$host/" "Michigan School"
            check "$host/jobs/" "Positions"
            check "$host/sitemap.xml" "<urlset"
            check "$host/counties/wayne/" "Wayne County"
          done
          # A real job page and its Apply link
          job=$(grep -o 'https://michigan-school-jobs.com/jobs/[^<]*' page.html | head -1 || true)
          curl -sS -m 30 https://michigan-school-jobs.com/sitemap.xml | grep -o 'https://michigan-school-jobs.com/jobs/[^<]*' | head -1 > joburl.txt || true
          if [ -s joburl.txt ]; then check "$(cat joburl.txt)" "Apply for Job"; fi
          exit $fail
