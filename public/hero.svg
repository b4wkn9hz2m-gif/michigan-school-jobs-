<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Original illustration for Michigan School Jobs: sunrise over a schoolhouse by the lake. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b7fd6"/><stop offset=".55" stop-color="#f2b38a"/><stop offset="1" stop-color="#ffe2b8"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6d8"/><stop offset=".6" stop-color="#ffd98c"/><stop offset="1" stop-color="#ffd98c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fa6e6"/><stop offset="1" stop-color="#3f63b8"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="1380" cy="560" r="260" fill="url(#sun)"/>
  <circle cx="1380" cy="560" r="96" fill="#fff1c9"/>
  <g fill="#fff" opacity=".7">
    <ellipse cx="380" cy="230" rx="140" ry="34"/><ellipse cx="470" cy="210" rx="90" ry="30"/>
    <ellipse cx="1560" cy="300" rx="160" ry="30"/><ellipse cx="1650" cy="282" rx="80" ry="26"/>
    <ellipse cx="980" cy="160" rx="110" ry="24"/>
  </g>
  <rect y="640" width="1920" height="140" fill="url(#lake)"/>
  <g stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".45">
    <path d="M1250 680h260M1300 712h170M1220 744h120M300 700h140M820 730h90"/>
  </g>
  <path d="M0 760 C300 700 520 720 760 760 S1300 820 1920 740 V1080 H0Z" fill="#6aa86e"/>
  <path d="M0 850 C380 790 760 830 1080 860 S1600 900 1920 840 V1080 H0Z" fill="#4f8f5a"/>
  <path d="M0 960 C420 900 900 940 1920 930 V1080 H0Z" fill="#3d7a4b"/>
  <!-- trees -->
  <g fill="#2f6b40">
    <path d="M150 820 l40 -120 l40 120z"/><path d="M215 830 l34 -100 l34 100z"/>
    <path d="M1640 800 l44 -130 l44 130z"/><path d="M1715 812 l36 -104 l36 104z"/><path d="M1780 820 l30 -88 l30 88z"/>
  </g>
  <g fill="#7a5233"><rect x="186" y="818" width="8" height="20"/><rect x="1680" y="798" width="8" height="22"/></g>
  <!-- schoolhouse -->
  <g transform="translate(620 600)">
    <rect x="0" y="120" width="420" height="200" fill="#d9534f"/>
    <path d="M-20 130 L210 20 L440 130Z" fill="#8b2f2c"/>
    <rect x="170" y="-40" width="80" height="90" fill="#d9534f"/>
    <path d="M160 -36 L210 -86 L260 -36Z" fill="#8b2f2c"/>
    <circle cx="210" cy="2" r="16" fill="#ffd98c"/>
    <rect x="175" y="220" width="70" height="100" rx="6" fill="#5b3a26"/>
    <g fill="#fff6d8" stroke="#8b2f2c" stroke-width="6">
      <rect x="40" y="170" width="80" height="70"/><rect x="300" y="170" width="80" height="70"/>
    </g>
    <path d="M80 170v70M40 205h80M340 170v70M300 205h80" stroke="#8b2f2c" stroke-width="5"/>
    <rect x="-30" y="318" width="480" height="14" rx="4" fill="#c9c2b5"/>
    <line x1="470" y1="330" x2="470" y2="120" stroke="#6b6b6b" stroke-width="6"/>
    <path d="M473 124 h60 v38 h-60z" fill="#3c5493"/>
  </g>
  <!-- school bus -->
  <g transform="translate(1180 880)">
    <rect x="0" y="0" width="320" height="110" rx="18" fill="#f6b51e"/>
    <rect x="250" y="20" width="70" height="90" rx="12" fill="#f6b51e"/>
    <g fill="#cfe3ff"><rect x="20" y="18" width="46" height="36" rx="6"/><rect x="78" y="18" width="46" height="36" rx="6"/><rect x="136" y="18" width="46" height="36" rx="6"/><rect x="194" y="18" width="46" height="36" rx="6"/><rect x="262" y="30" width="44" height="30" rx="6"/></g>
    <rect x="0" y="70" width="320" height="8" fill="#1c1c1c"/>
    <circle cx="70" cy="112" r="24" fill="#2b2b2b"/><circle cx="70" cy="112" r="10" fill="#9a9a9a"/>
    <circle cx="260" cy="112" r="24" fill="#2b2b2b"/><circle cx="260" cy="112" r="10" fill="#9a9a9a"/>
  </g>
  <!-- path to school -->
  <path d="M760 1080 C800 1000 820 960 830 935 L890 935 C900 960 940 1010 1010 1080Z" fill="#e8d9b8" opacity=".9"/>
</svg>
